name: GitHub Pages

# 클리커를 정적 사이트로 빌드해 https://<owner>.github.io/<repo>/ 에 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해야 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify clicker asset paths are Pages-rewritable
        run: node scripts/check-clicker-pages-paths.mjs
      - name: Strip server routes and prefix asset paths
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bash scripts/prepare-pages.sh
      - name: Static export
        env:
          GITHUB_PAGES: "1"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NODE_ENV: production
        run: |
          npx next build
          touch out/.nojekyll
      - name: Install Chromium for Pages smoke
        run: npx playwright install chromium
      - name: Pages smoke (static export)
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run test:smoke:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
