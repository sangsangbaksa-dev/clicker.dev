<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOCASKY · 영어 단어 학습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4FA;--sf:#fff;--ink:#1B2340;--mute:#6B7391;--line:#E1E6F2;--ac:#3D5AFE;--ac2:#E8ECFF;--ok:#0CA678;--okbg:#DDF7EE;--bad:#E8590C;--badbg:#FFE9DD;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
header{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;margin-right:auto;cursor:pointer}
.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0}
.nv{background:none;padding:8px 14px;border-radius:10px;color:var(--mute);font-weight:500}
.nv:hover{background:var(--bg)}.nv.on{background:var(--ac2);color:var(--ac);font-weight:700}
main{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.unit{cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left}
.unit:hover{border-color:var(--ac);box-shadow:0 6px 18px rgba(61,90,254,.12)}
.unit .n{font-size:22px;font-weight:900}.unit .c{color:var(--mute);font-size:14px}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.btn{background:var(--ac);color:#fff;padding:11px 20px;border-radius:11px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--ac2);color:var(--ac)}.btn.d{background:var(--badbg);color:var(--bad)}
.btn.w{width:100%}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.mode{background:var(--bg);border:2px solid transparent;border-radius:var(--r);padding:18px;text-align:left}
.mode:hover{border-color:var(--ac)}.mode b{display:block;font-size:16px}.mode span{color:var(--mute);font-size:13px}
.q{max-width:560px;margin:auto;text-align:center}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.word{font-size:40px;font-weight:900;letter-spacing:-1px;margin:22px 0 26px;word-break:keep-all}
.word.k{font-size:32px}
.opts{display:grid;gap:10px}
.opt{background:var(--sf);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:500}
.opt:hover{border-color:var(--ac)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
input,textarea,select{font:inherit;width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
.ans.ok{border-color:var(--ok);background:var(--okbg)}.ans.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;font-weight:700;min-height:26px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-size:56px;font-weight:900;color:var(--ac);margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:13px}
.auth{max-width:400px;margin:40px auto}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:9px;background:none;font-weight:700;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.f{display:grid;gap:10px}
.side{max-height:70vh;overflow:auto}
.two{display:grid;grid-template-columns:220px 1fr;gap:18px}
@media(max-width:700px){.two{grid-template-columns:1fr}.word{font-size:32px}}
.side button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:none;font-weight:500;margin-bottom:4px}
.side button.on{background:var(--ac2);color:var(--ac);font-weight:700}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.it span:first-child{font-weight:700;flex:1}.it span:nth-child(2){flex:1;color:var(--mute)}
.x{background:none;color:var(--mute);font-size:18px;padding:0 6px}.x:hover{color:var(--bad)}
.note{background:#FFF8DB;border:1px solid #F5E3A0;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 32px;color:#fff;background:linear-gradient(135deg,#3D5AFE 0%,#4C8DFF 55%,#8FD3FF 100%);margin-bottom:20px}
.hero::before,.hero::after{content:"";position:absolute;background:rgba(255,255,255,.16);border-radius:99px}
.hero::before{width:260px;height:90px;right:-40px;top:24px;box-shadow:-90px 70px 0 -6px rgba(255,255,255,.12)}
.hero::after{width:170px;height:60px;right:150px;bottom:-18px}
.hero h1{font-size:32px;margin:0 0 6px;position:relative}.hero p{margin:0;opacity:.92;position:relative;max-width:460px}
.hero .row{justify-content:flex-start;position:relative}
.hero .btn{background:#fff;color:var(--ac)}.hero .btn.g{background:rgba(255,255,255,.22);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:16px 18px}.stat b{display:block;font-size:28px;font-weight:900;color:var(--ac);line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:26px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.hero{padding:26px 22px}}
.wod{background:linear-gradient(160deg,#fff,#EEF2FF)}.wod .w{font-size:34px;font-weight:900;margin:8px 0 2px;letter-spacing:-.5px}.wod .m{font-size:18px;color:var(--mute)}
.unit .top{display:flex;justify-content:space-between;margin-bottom:12px}.unit .pill.ok{background:var(--okbg);color:var(--ok)}
.unit .pv{color:var(--mute);font-size:13px;margin:6px 0 14px;min-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar2{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#5AB0FF)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}.sec h2{margin:0;font-size:20px}
.authwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:stretch;margin-top:10px}
@media(max-width:800px){.authwrap{grid-template-columns:1fr}}
.authwrap .hero{margin:0;display:flex;flex-direction:column;justify-content:center;min-height:420px}
.authwrap .auth{margin:0;max-width:none}
.feat{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;position:relative}
.feat li{background:rgba(255,255,255,.18);border-radius:12px;padding:11px 14px;font-weight:500}
footer{max-width:1120px;margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:13px;text-align:center}
</style>
</head>

const API = {
  async init(){
    if (!CFG.apiKey) return;
    const v = '10.12.0', b = `https://www.gstatic.com/firebasejs/${v}/`;
    const [A, Au, F] = await Promise.all([import(b+'firebase-app.js'), import(b+'firebase-auth.js'), import(b+'firebase-firestore.js')]);
    const app = A.initializeApp(CFG);
    fb = { Au, F, auth: Au.getAuth(app), db: F.getFirestore(app) };
  },
  wrap(u){ return u && { id:u.email.split('@')[0], name:u.displayName || u.email.split('@')[0], uid:u.uid }; },
  async me(){
    if (fb) return new Promise(r => { const off = fb.Au.onAuthStateChanged(fb.auth, u => { off(); r(this.wrap(u)); }); });
    const e = LS('vs'); const u = e && (LS('vu') || {})[e]; return u ? { id:e, name:u.n, uid:e } : null;
  },
  async signup(e, p, n){
    if (fb){ const r = await fb.Au.createUserWithEmailAndPassword(fb.auth, mail(e), p); await fb.Au.updateProfile(r.user, { displayName:n }); return { id:e, name:n, uid:r.user.uid }; }
    const u = LS('vu') || {}; if (u[e]) throw { code:'auth/email-already-in-use' };
    u[e] = { p, n }; LS('vu', u); LS('vs', e); return { id:e, name:n, uid:e };
  },
  async login(e, p){
    if (fb){ const r = await fb.Au.signInWithEmailAndPassword(fb.auth, mail(e), p); return this.wrap(r.user); }
    const u = (LS('vu') || {})[e]; if (!u || u.p !== p) throw { code:'auth/invalid-credential' };
    LS('vs', e); return { id:e, name:u.n, uid:e };
  },
  async logout(){ fb ? await fb.Au.signOut(fb.auth) : LS('vs', null); },
  async units(){
    if (fb){ const s = await fb.F.getDoc(fb.F.doc(fb.db, 'app', 'units')); return s.exists() ? s.data().list : SEED; }
    return LS('un') || SEED;
  },
  async saveUnits(list){ fb ? await fb.F.setDoc(fb.F.doc(fb.db, 'app', 'units'), { list }) : LS('un', list); },
  async addRec(r){
    if (fb) return fb.F.addDoc(fb.F.collection(fb.db, 'users', S.user.uid, 'records'), r);
    const k = 'rc_' + S.user.uid; LS(k, [r, ...(LS(k) || [])].slice(0, 100));
  },
  async recs(){
    if (fb){ const c = fb.F.collection(fb.db, 'users', S.user.uid, 'records');
      const s = await fb.F.getDocs(fb.F.query(c, fb.F.orderBy('t', 'desc'), fb.F.limit(50))); return s.docs.map(d => d.data()); }
    return LS('rc_' + S.user.uid) || [];
  }
};

async function hashPw(pw){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:new TextEncoder().encode(ADMIN_SALT), iterations:150000 }, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

   <button class="mode" data-act="start" data-v="speed"><b>스피드 게임</b><span>60초 동안 두 유형이 섞여 나오는 도전 게임</span></button></div></div>
  <div class="card" style="margin-top:16px"><h2>단어 목록</h2>${u.items.map(i => `<div class="it"><span>${esc(i.en)}</span><span>${esc(i.ko)}</span></div>`).join('')}</div>`;
}
function quizView(){
  const q = S.q, fbk = q.fb, sp = q.mode === 'speed';
  const pct = sp ? (q.left / 60 * 100) : (q.i / q.list.length * 100);
  const head = `<div class="prog"><i id="pg" style="width:${pct}%"></i></div><div class="meta"><span>${MODE[q.mode]} · ${esc(q.u.name)}</span><span>${sp ? `<b id="tm">${q.left}</b>초 · 정답 ${q.ok}` : `${Math.min(q.i + (fbk?0:1), q.list.length)} / ${q.list.length}`}</span></div>`;
  let body;
  if (q.type === 'mc'){
    body = `<div class="word">${esc(q.cur.en)}</div><div class="opts">${q.opts.map(o => {
      let c = ''; if (fbk) c = o === q.cur.ko ? 'ok' : (o === fbk.v ? 'bad' : '');
      return `<button class="opt ${c}" data-act="pick" data-v="${esc(o)}">${esc(o)}</button>`; }).join('')}</div>`;
  } else {
    body = `<div class="word k">${esc(q.cur.ko)}</div><input id="ans" class="ans ${fbk ? (fbk.ok?'ok':'bad') : ''}" placeholder="영어로 입력하고 Enter" autocomplete="off" autocapitalize="off" spellcheck="false" ${fbk ? `value="${esc(fbk.v)}" disabled` : ''}>
    ${fbk ? '' : '<div class="row"><button class="btn" data-act="submit">확인</button></div>'}`;
  }
  const msg = fbk ? `<div class="fb ${fbk.ok?'ok':'bad'}">${fbk.ok ? '정답!' : `오답 · 정답: ${esc(q.type==='mc'?q.cur.ko:q.cur.en)}`}</div>` : '<div class="fb"></div>';
  return `<div class="q">${head}${body}${msg}</div>`;
}
function resultView(){
  const r = S.q.res;
  return `<div class="q card"><span class="pill">${MODE[r.mode]} · ${esc(r.unit)}</span><div class="score">${r.ok} / ${r.total}</div>
  <p class="sub">${r.total && r.ok / r.total >= .8 ? '훌륭해요! 거의 다 외웠어요.' : '틀린 단어를 다시 확인해 보세요.'}</p>
  ${S.q.wrong.length ? `<h2>다시 볼 단어</h2>${[...new Map(S.q.wrong.map(w => [w.en, w])).values()].map(i => `<div class="it"><span>${esc(i.en)}</span><span>${esc(i.ko)}</span></div>`).join('')}` : ''}
  <div class="row"><button class="btn" data-act="start" data-v="${r.mode}">다시 도전</button><button class="btn g" data-act="unit" data-v="${esc(S.q.u.id)}">모드 선택</button><button class="btn g" data-act="home">목록</button></div></div>`;
}
function recordsView(){
  const best = {}; S.recs.forEach(r => { const k = r.unit + '|' + r.mode; if (!best[k] || r.ok > best[k].ok) best[k] = r; });
  return `<h1>내 기록</h1><p class="sub">최근 학습 50회가 저장돼요.</p>
  <div class="card">${S.recs.length ? `<table><tr><th>날짜</th><th>UNIT</th><th>모드</th><th>점수</th></tr>${S.recs.map(r => `<tr><td>${new Date(r.t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.unit)}</td><td>${MODE[r.mode]}</td><td><b>${r.ok}</b> / ${r.total}${best[r.unit+'|'+r.mode]===r?' <span class="pill">최고</span>':''}</td></tr>`).join('')}</table>` : '아직 기록이 없어요. 퀴즈를 풀어 보세요!'}</div>`;
}
function aboutView(){
  return `<div class="hero"><h1>만든 사람</h1><p>VOCASKY가 만들어진 이야기</p></div>
  <div class="card"><span class="pill">Developer</span><h1 style="margin-top:8px">김시율</h1>
  <p>안녕하세요, 김시율이에요. 저는 14세에 이 사이트를 만들었어요.</p>
  <p>영어 단어를 더 쉽고 재미있게 외우고 싶어서 직접 VOCASKY를 만들었어요. UNIT별로 단어를 외우고, 퀴즈와 스피드 게임으로 확인하고, 내 기록까지 남길 수 있어요.</p>
  <p style="margin-bottom:0">쓰다가 불편한 점이나 바라는 기능이 있으면 꼭 알려 주세요. 함께 더 좋은 사이트로 키워 가요!</p></div>`;
}
function gateView(){
  return `<div class="auth card"><h1>관리자 확인</h1><p class="sub">단어 관리는 관리자 비밀번호가 필요해요.</p>
  <div class="f"><input id="ap" type="password" placeholder="관리자 비밀번호" autocomplete="off"><button class="btn w" data-act="unlock">확인</button></div></div>`;
}
function adminView(){
  if (!S.adminOK) return gateView();
  const u = S.units.find(x => x.id === S.adm);
  return `<h1>단어 관리</h1><p class="sub">UNIT을 만들고 단어나 지문 속 구문을 등록하세요.</p>
  ${fb ? '' : '<div class="note">데모 모드에서는 누구나 관리자 화면을 볼 수 있어요. 실제 운영에서는 관리자 이메일만 접근합니다.</div>'}
  <div class="two"><div class="card side"><h2>UNIT</h2>${S.units.map(x => `<button class="${x.id===S.adm?'on':''}" data-act="sel" data-v="${esc(x.id)}">${esc(x.name)}</button>`).join('')}
    <div class="f" style="margin-top:10px"><input id="nu" placeholder="예: UNIT6"><button class="btn g" data-act="newunit">+ UNIT 추가</button></div></div>
  <div class="card">${u ? `<h2>${esc(u.name)} <span class="pill">${u.items.length}개</span></h2>
    <div class="f"><textarea id="bulk" rows="5" placeholder="한 줄에 하나씩: 영어 = 한글 뜻&#10;ancient = 고대의&#10;take part in = ~에 참여하다"></textarea>
    <div class="row" style="justify-content:flex-start;margin:0"><button class="btn" data-act="addwords">단어 추가</button><button class="btn d" data-act="delunit">UNIT 삭제</button></div></div>
    <div style="margin-top:16px">${u.items.map((i, n) => `<div class="it"><span>${esc(i.en)}</span><span>${esc(i.ko)}</span><button class="x" data-act="delitem" data-v="${n}" aria-label="삭제">×</button></div>`).join('')}</div>` : '<p class="sub" style="margin:0">왼쪽에서 UNIT을 선택하거나 새로 추가하세요.</p>'}</div></div>`;
}

/* ============ 퀴즈 엔진 ============ */
function start(mode){
  const u = S.units.find(x => x.id === S.pick);
  if (S.units.flatMap(x => x.items).length < 4) return toast('단어가 전체 4개 이상 있어야 해요.');
  if (!u.items.length) return toast('이 UNIT에는 단어가 없어요.');
  clearInterval(S.q?.timer);
  const q = S.q = { u, mode, list: sh(u.items), i:0, ok:0, wrong:[], left:60, fb:null };
  if (mode === 'speed') q.timer = setInterval(() => {
    q.left--; if (q.left <= 0) return finish();
    const t = $('#tm'), p = $('#pg'); if (t) t.textContent = q.left; if (p) p.style.width = q.left / 60 * 100 + '%';
  }, 1000);
  nextQ();
}
function nextQ(){
  const q = S.q; if (S.view === 'result') return;
  if (q.i >= q.list.length){ if (q.mode !== 'speed') return finish(); q.list = q.list.concat(sh(q.u.items)); }
  q.cur = q.list[q.i];
  q.type = q.mode === 'speed' ? (Math.random() < .5 ? 'mc' : 'typ') : q.mode;
  if (q.type === 'mc'){
    const pool = [...new Set(S.units.flatMap(x => x.items).map(x => x.ko).filter(k => k !== q.cur.ko))];
    q.opts = sh([q.cur.ko, ...sh(pool).slice(0, 3)]);
  }
  q.fb = null; go('quiz');
}
function answer(v){
  const q = S.q; if (!q || q.fb || S.view !== 'quiz') return;
  const ok = q.type === 'mc' ? v === q.cur.ko : v.trim().toLowerCase().replace(/\s+/g, ' ') === q.cur.en.toLowerCase();
  q.fb = { ok, v }; q.i++; ok ? q.ok++ : q.wrong.push(q.cur); render();
  setTimeout(() => { if (S.q === q) nextQ(); }, ok ? 600 : 1500);
}
async function finish(){
  const q = S.q; clearInterval(q.timer);
  q.res = { unit:q.u.name, mode:q.mode, ok:q.ok, total: q.mode === 'speed' ? q.i : q.list.length, t:Date.now() };
  S.recs.unshift(q.res);
  go('result');
  try { await API.addRec(q.res); } catch (e) { toast('기록 저장에 실패했어요.'); }
}

/* ============ 관리자 동작 ============ */
const saveU = async () => { try { await API.saveUnits(S.units); } catch (e) { toast('저장 권한이 없거나 오류가 발생했어요.'); } render(); };
const parse = t => t.split('\n').map(l => l.trim().match(/^(.+?)\s*(?:=|\t|,)\s*(.+)$/)).filter(Boolean).map(m => ({ en:m[1].trim(), ko:m[2].trim() }));

/* ============ 이벤트 ============ */
const ACT = {
  quick(){ S.pick = S.units[Math.floor(Math.random() * S.units.length)].id; start('speed'); },
  home: () => { clearInterval(S.q?.timer); go('home'); },
  tab: d => { S.tab = d.v; render(); },
  async login(){
    const id = $('#em').value.trim().toLowerCase();
    if (!id || !$('#pw').value) return toast('아이디와 비밀번호를 입력해 주세요.');
    try { S.user = await API.login(id, $('#pw').value); } catch (e) { return toast(errMsg(e, '로그인에 실패했어요.')); }
    await boot();
  },
  async signup(){
    const n = $('#nm').value.trim(); if (!n) return toast('닉네임을 입력해 주세요.');
    const id = $('#em').value.trim().toLowerCase();
    if (!/^[a-z0-9_]{4,20}$/.test(id)) return toast('아이디는 영문 소문자·숫자·_ 4~20자로 만들어 주세요.');
    if ($('#pw').value.length < 6) return toast('비밀번호는 6자 이상이어야 해요.');
    try { S.user = await API.signup(id, $('#pw').value, n); } catch (e) { return toast(errMsg(e, '가입에 실패했어요.')); }
    await boot();
  },
  about: () => go('about'),
  async unlock(){ if (await hashPw($('#ap').value) === ADMIN_HASH){ S.adminOK = true; render(); } else toast('비밀번호가 맞지 않아요.'); },
  async logout(){ await API.logout(); S.user = null; S.adminOK = false; S.tab = 'login'; S.view = 'auth'; render(); },
  unit: d => { S.pick = d.v; go('unit'); },
  start: d => start(d.v),
  pick: d => answer(d.v),
  submit: () => answer($('#ans').value),
  async records(){ S.recs = await API.recs(); go('records'); },
  admin: () => { S.adm = S.adm || S.units[0]?.id; go('admin'); },
  sel: d => { S.adm = d.v; render(); },
  newunit(){ const n = $('#nu').value.trim(); if (!n) return; const u = { id:'u' + Date.now(), name:n, items:[] }; S.units.push(u); S.adm = u.id; saveU(); },
  addwords(){ const w = parse($('#bulk').value); if (!w.length) return toast('형식: 영어 = 한글 뜻'); S.units.find(x => x.id === S.adm).items.push(...w); saveU(); },
  delitem: d => { S.units.find(x => x.id === S.adm).items.splice(+d.v, 1); saveU(); },
  delunit(){ if (!confirm('이 UNIT을 삭제할까요?')) return; S.units = S.units.filter(x => x.id !== S.adm); S.adm = S.units[0]?.id; saveU(); }
};
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) ACT[a.dataset.act](a.dataset); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'ans') answer(e.target.value);
  else if (e.target.id === 'ap') ACT.unlock();
  else if (e.target.id === 'pw') ACT[S.tab === 'signup' ? 'signup' : 'login']();
});

/* ============ 시작 ============ */
async function boot(){
  try { S.units = await API.units(); } catch (e) { console.error(e); S.units = SEED; toast('단어 데이터를 불러오지 못했어요. Firestore 규칙을 확인해 주세요.'); }
  try { S.recs = await API.recs(); } catch (e) { console.error(e); S.recs = []; }
  S.view = 'home'; render(); }
(async () => {
  try { await API.init(); S.user = await API.me(); } catch (e) { console.error(e); S.fail = true; }
  if (CFG.apiKey && !fb) { $('#app').innerHTML = '<div class="card"><h2>서버에 연결하지 못했어요</h2><p>인터넷 연결과 CFG(Firebase 설정값)를 확인한 뒤 새로고침해 주세요.</p></div>'; return; }
  S.user ? boot() : render();
})();
</script>
</body>
</html>
